name: thermostat-sonoff-trv-zbt
components:
- id: main
  capabilities:
  - id: temperatureMeasurement
    version: 1
  - id: thermostatHeatingSetpoint
    version: 1
    config:
      values:
      - key: "heatingSetpoint.value"
        range: [5, 30]
  - id: thermostatMode
    version: 1
  - id: battery
    version: 1
  - id: refresh
    version: 1
  categories:
  - name: Thermostat
- id: bluetooth
  label: Bluetooth Pairing
  capabilities:
  - id: momentary
    version: 1
  categories:
  - name: Button
preferences:
- name: "childLock"
  title: "Child lock"
  description: "Enable or disable the child lock of the thermostat."
  required: false
  preferenceType: enumeration
  definition:
    options:
      0: "Unlock"
      1: "Lock"
    default: 0
