name: thermostat-sonoff-trv-zbt
components:
- id: main
  capabilities:
  - id: temperatureMeasurement
    version: 1
  - id: thermostatHeatingSetpoint
    version: 1
    config:
      values:
      - key: "heatingSetpoint.value"
        range: [5, 30]
  - id: thermostatMode
    version: 1
  - id: battery
    version: 1
  - id: refresh
    version: 1
  categories:
  - name: Thermostat
- id: bluetooth
  label: Bluetooth Pairing
  capabilities:
  - id: momentary
    version: 1
  categories:
  - name: Button
