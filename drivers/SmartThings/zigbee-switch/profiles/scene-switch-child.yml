name: scene-switch-child
components:
  - id: main
    capabilities:
      - id: switch
        version: 1
      - id: refresh
        version: 1
    categories:
      - name: Switch
preferences:
  - preferenceId: stse.changeToWirelessSwitch
    explicit: true
  - title: Countdown Seconds
    name: countdownSeconds
    description: Set the relay countdown in seconds; 0 disables the countdown.
    required: false
    preferenceType: integer
    definition:
      minimum: 0
      maximum: 43200
      default: 0
