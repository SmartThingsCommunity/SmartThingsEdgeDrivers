name: aqara-lightstrip-rgbw
components:
- id: main
  capabilities:
  - id: switch
    version: 1
  - id: switchLevel
    version: 1
    config:
      values:
        - key: "level.value"
          range: [1, 100]
  - id: colorTemperature
    version: 1
  - id: colorControl
    version: 1
  - id: refresh
    version: 1
  categories:
  - name: Light
- id: mode
  capabilities:
  - id: mode
    version: 1
  categories:
  - name: Light
preferences:
  - preferenceId: stse.restorePowerState
    explicit: true
  - preferenceId: stse.lightFadeInTimeInSec
    explicit: true
  - preferenceId: stse.lightFadeOutTimeInSec
    explicit: true
