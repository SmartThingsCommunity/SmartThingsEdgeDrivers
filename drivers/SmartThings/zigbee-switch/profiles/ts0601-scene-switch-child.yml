name: ts0601-scene-switch-child
components:
  - id: main
    capabilities:
      - id: switch
        version: 1
      - id: refresh
        version: 1
    categories:
      - name: Switch
preferences:
  - title: Mode
    name: switchMode
    description: Switch mode shows a controllable relay; scene mode shows a wireless button.
    required: true
    preferenceType: enumeration
    definition:
      options:
        switch: Switch
        scene: Scene
      default: switch
  - title: Countdown Seconds
    name: countdownSeconds
    description: Set the relay countdown in seconds; 0 disables the countdown.
    required: false
    preferenceType: integer
    definition:
      minimum: 0
      maximum: 43200
      default: 0
