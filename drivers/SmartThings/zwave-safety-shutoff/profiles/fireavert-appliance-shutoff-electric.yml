name: fireavert-appliance-shutoff-electric
components:
- id: main
  label: "FireAvert Information"
  capabilities:
  - id: refresh
    version: 1
  - id: soundDetection
    version: 1
  - id: switch
    version: 1
- id: appliancePower
  label: "Appliance Power"
  capabilities:
  - id: applianceUtilization
    version: 1
  categories:
    - name: SmokeDetector
deviceConfig:
  dashboard:
    states:
      - component: main
        capability: soundDetection
        version: 1
  detailView:
    - component: main
      capability: soundDetection
      version: 1
      values:
      - key: soundDetected.value
        alternatives:
        - key: noSound
          value: "No Alarm"
          type: inactive
        - key: fireAlarm
          value: "Fire Alarm Detected"
          type: active
        enabledValues:
          - noSound
          - fireAlarm
    - component: main
      capability: switch
      version: 1
    - component: appliancePower
      capability: applianceUtilization
      version: 1
      values:
      - key: status.value
        alternatives:
        - key: inUse
          value: "Appliance Powered On"
          type: active
        - key: notInUse
          value: "Appliance Powered Off"
          type: inactive
  automation:  
    conditions:
      - component: main
        capability: soundDetection
        version: 1
        values:
          - key: soundDetected.value
            enabledValues:
              - fireAlarm
      - component: main
        capability: switch
        version: 1
      - component: appliancePower
        capability: applianceUtilization
        version: 1
        values:
        - key: status.value
    actions:
      - component: main
        capability: switch
        version: 1