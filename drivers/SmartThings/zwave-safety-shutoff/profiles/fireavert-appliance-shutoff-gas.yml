name: fireavert-appliance-shutoff-gas
components:
- id: main
  label: "Appliance Control"
  capabilities:
  - id: refresh
    version: 1
  - id: soundDetection
    version: 1
    config:
      values:
        - key: soundDetected.value
          enabledValues:
            - noSound
            - fireAlarm
  - id: safetyValve
    version: 1
  categories:
    - name: SmokeDetector
